[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-spatial-priors"
version = "0.1.0"
description = "Reproducible analyses for How Much Neural Data Is Cortical Position Worth?"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "matplotlib>=3.10,<4",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
nwb = ["h5py>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]
